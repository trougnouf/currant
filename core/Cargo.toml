# ./core/Cargo.toml
[package]
name = "cassis-core"
version = "0.1.0"
edition = "2024"
description = "Core library catalog, query engine and playback state for Cassis."
license = "GPL-3.0-or-later"

[dependencies]
serde.workspace = true
tokio.workspace = true
fastrand = "2.1"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
walkdir = "2.5"
lofty = "0.25" # Lightning-fast metadata parser, also writes tags back
rusqlite = { version = "0.32", features = ["bundled"] } # embedded catalog, indexed search
dirs = "6"
serde_json = "1"
ureq = { version = "2.12", features = ["json", "tls"] } # scrobbler HTTP (Listenbrainz)

uniffi = { version = "0.32", optional = true }

[features]
android = ["uniffi"]
