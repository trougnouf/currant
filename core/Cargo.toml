# ./core/Cargo.toml
[package]
name = "currant-core"
version = "0.1.2"
edition = "2024"
description = "Core library catalog, query engine and playback state for Currant."
license = "GPL-3.0-or-later"
authors = ["Benoit Brummer (Trougnouf)"]

[dependencies]
serde.workspace = true
tokio.workspace = true
fastrand = "2.5"
uuid = { version = "1.26", features = ["v4", "fast-rng"] }
walkdir = "2.5"
lofty = "0.25" # Lightning-fast metadata parser, also writes tags back
rusqlite = { version = "0.40", features = ["bundled", "functions"] } # embedded catalog, indexed search
dirs = "7"
serde_json.workspace = true
ureq = { version = "3.4", features = ["json"] } # scrobbler HTTP (Listenbrainz, rustls by default)
unicode-normalization = "0.1" # accent-insensitive search

uniffi = { version = "0.32", optional = true }

[features]
android = ["uniffi"]
