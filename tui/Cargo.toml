# ./tui/Cargo.toml
[package]
name = "currant-tui"
version = "0.1.2"
edition = "2024"
description = "Terminal music player for Currant."
license = "GPL-3.0-or-later"
authors = ["Benoit Brummer (Trougnouf)"]

[dependencies]
currant-core = { path = "../core" }
fastrand = "2.5"
serde.workspace = true
serde_json = "1"
ratatui = "0.30"
crossterm = "0.29"
dirs = "7"
unicode-width = "0.2"
# rodio uses symphonia internally to decode flac/mp3/ogg(vorbis)/wav.
# symphonia-ogg is the OGG container demuxer — without it symphonia can open
# neither OGG/Vorbis nor OGG/Opus files.
# symphonia-wav is only the RIFF demuxer; symphonia-pcm adds the PCM codec
# that decodes the samples — without it every .wav fails to open.
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-flac", "symphonia-mp3", "symphonia-vorbis", "symphonia-ogg", "symphonia-wav", "symphonia-pcm"] }
ogg = { version = "0.9", optional = true }
opus = { version = "0.4", optional = true }
# OS media integration (MPRIS on Linux, SMTC on Windows, Media Remote on macOS).
souvlaki = "0.8"
# Directory watching for the library roots (auto-rescan on file changes).
notify = "8"
# Read ReplayGain tags at playback time.
lofty = "0.25"
# WebSocket client for remote zone control (talks to a peer's /ws endpoint).
tungstenite = "0.30.0"
# Strict TLS for the zone control channel (peer cert is derived from the token).
rustls = { version = "0.23", features = ["ring"] }

[features]
default = ["opus"]
# Enables .opus playback via libopus + the ogg demuxer (needs libopus/libogg).
opus = ["dep:ogg", "dep:opus"]
