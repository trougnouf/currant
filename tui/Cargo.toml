# ./tui/Cargo.toml
[package]
name = "framboise-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal music player for Framboise."
license = "GPL-3.0-or-later"

[dependencies]
framboise-core = { path = "../core" }
ratatui = "0.26"
crossterm = "0.29"
dirs = "6"
# rodio uses symphonia internally to decode flac/mp3/ogg(vorbis)/wav.
rodio = { version = "0.18", default-features = false, features = ["symphonia-flac", "symphonia-mp3", "symphonia-vorbis", "symphonia-wav"] }
ogg = { version = "0.9", optional = true }
opus = { version = "0.4", optional = true }

[features]
default = ["opus"]
# Enables .opus playback via libopus + the ogg demuxer (needs libopus/libogg).
opus = ["dep:ogg", "dep:opus"]
