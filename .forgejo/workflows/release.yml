name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # --- BUILD LINUX ARTIFACTS ---
  build-linux:
    runs-on: self-hosted-ubuntu
    container:
      image: local/ubuntu-builder
      volumes:
        - cargo-registry:/usr/local/cargo/registry
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libopus-dev libogg-dev libasound2-dev pkg-config

      - name: Build Linux binaries
        run: cargo build --release --locked

      - name: Create archives
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW_VERSION="${{ github.ref_name }}"
            CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//')
          else
            RAW_VERSION="debug-${{ github.sha }}"
            CLEAN_VERSION="$RAW_VERSION"
          fi

          mkdir -p dist

          # Source tarball
          git archive --format=tar.gz --prefix="cassis-${CLEAN_VERSION}/" -o "dist/cassis-source-${RAW_VERSION}.tar.gz" HEAD

          # Linux binary tarball
          mkdir "cassis-linux-${CLEAN_VERSION}"
          cp target/release/cassis-tui "cassis-linux-${CLEAN_VERSION}/"
          cp target/release/cassis-ctl "cassis-linux-${CLEAN_VERSION}/"
          cp README.md "cassis-linux-${CLEAN_VERSION}/"
          tar -cJvf "dist/cassis-linux-${RAW_VERSION}.tar.xz" "cassis-linux-${CLEAN_VERSION}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v3
        with:
          name: linux-artifacts
          path: dist/*

  # --- PUBLISH RELEASE & AUR ---
  publish:
    needs: [build-linux]
    runs-on: self-hosted-arch
    container:
      image: local/arch-builder
      volumes:
        - cargo-registry:/usr/local/cargo/registry
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@v3
        with:
          name: linux-artifacts
          path: dist

      - name: Generate changelog
        run: git-cliff --config cliff.toml --verbose --latest --strip header --output dist/CHANGELOG_RELEASE.md

      - name: Sign release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GPG_SIGNING_SUBKEY: ${{ secrets.GPG_SIGNING_SUBKEY }}
          GPG_KEY_FINGERPRINT: ${{ secrets.GPG_KEY_FINGERPRINT }}
        run: |
          echo "$GPG_SIGNING_SUBKEY" | base64 --decode | gpg --import --batch --pinentry-mode loopback
          cd dist
          for file in *; do
            if [ -f "$file" ] && [ "$file" != "CHANGELOG_RELEASE.md" ]; then
              echo "Signing $file..."
              gpg --batch --yes --pinentry-mode loopback --passphrase '' \
                --local-user "$GPG_KEY_FINGERPRINT" \
                --detach-sign --armor "$file"
            fi
          done

      - name: Upload to git.disroot.org releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          tea login add --name disroot --url ${{ github.server_url }} --token ${{ secrets.RELEASE_TOKEN }}
          tea release delete --repo ${{ github.repository }} --confirm ${{ github.ref_name }} || true

          tea release create \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --tag "${{ github.ref_name }}" \
            --note-file dist/CHANGELOG_RELEASE.md

          cd dist
          for file in *; do
            if [ "$file" != "CHANGELOG_RELEASE.md" ] && [ -f "$file" ]; then
              echo "Uploading $file..."
              tea release assets create --repo ${{ github.repository }} ${{ github.ref_name }} "$file"
            fi
          done

